<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Program Details | Activity Haven Recreation Centre</title>
<meta name="description" id="pageDesc" content="Program details from Activity Haven Recreation Centre in Peterborough.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --teal-deep: #1E5F5B;
  --teal-mid: #2F8C82;
  --teal-pale: #E4EFEC;
  --cream: #FAF3E4;
  --paper: #FFFDF8;
  --coral: #D6604A;
  --coral-dark: #B84D39;
  --gold: #E3A23B;
  --charcoal: #2B2B26;
  --charcoal-soft: #55524A;
  --font-display: "Playfair Display", Georgia, serif;
  --font-body: "Alegreya Sans", -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-body); color: var(--charcoal); background: var(--cream); font-size: 18px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
a { color: inherit; text-decoration: none; }

.site-header { background: var(--paper); border-bottom: 3px solid var(--teal-deep); }
.header-inner { max-width: 900px; margin: 0 auto; padding: 14px 96px; }
.back-link { font-weight: 700; color: var(--teal-deep); font-size: 1.05rem; }
.back-link:hover { color: var(--coral); }

.detail-wrap { max-width: 760px; margin: 0 auto; padding: 56px 96px 90px; }
.detail-card {
  background: var(--paper);
  border-radius: 18px;
  box-shadow: 0 12px 30px rgba(30,26,20,0.12);
  padding: 40px 44px;
  border-top: 6px solid var(--teal-mid);
}
.detail-card[data-type="Instructional"] { border-top-color: var(--coral); }
.detail-card[data-type="Special Event"] { border-top-color: var(--gold); }
.type-badge {
  display: inline-block;
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  background: var(--teal-pale);
  color: var(--teal-deep);
  padding: 5px 12px;
  border-radius: 999px;
  margin-bottom: 16px;
}
.detail-card[data-type="Instructional"] .type-badge { background: #F3E4E0; color: var(--coral-dark); }
.detail-card[data-type="Special Event"] .type-badge { background: #FBEBC9; color: #8A5A12; }
.status-badge {
  display: inline-block;
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 5px 12px;
  border-radius: 999px;
  margin-bottom: 16px;
  margin-left: 8px;
}
.status-badge[data-status="paused"] { background: #FBEBC9; color: #8A5A12; }
.status-badge[data-status="rescheduled"] { background: #FBEBC9; color: #8A5A12; }
.status-badge[data-status="cancelled"] { background: #F3E4E0; color: var(--coral-dark); }
.status-badge[data-status="ended"] { background: #ECE9E1; color: var(--charcoal-soft); }
.detail-image-wrap {
  position: relative;
  width: 100%;
  height: 340px;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 24px;
  background: var(--teal-pale);
}
.detail-image-skeleton {
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, var(--teal-pale) 30%, #ffffff 50%, var(--teal-pale) 70%);
  background-size: 300% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer {
  0% { background-position: 120% 0; }
  100% { background-position: -20% 0; }
}
.detail-image {
  position: relative;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.detail-image.is-loaded { opacity: 1; }
.detail-video-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 24px;
  background: var(--charcoal);
}
.detail-video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.detail-video-native { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--charcoal); }
@media (prefers-reduced-motion: reduce) {
  .detail-image-skeleton { animation: none; }
}
.detail-card h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); color: var(--teal-deep); font-weight: 600; margin-bottom: 18px; line-height: 1.2; }
.detail-meta { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 26px; }
.detail-meta div { font-size: 1rem; }
.detail-meta span.label { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--charcoal-soft); font-weight: 700; margin-bottom: 3px; }
.detail-desc { font-size: 1.08rem; color: var(--charcoal-soft); border-top: 1px solid var(--teal-pale); padding-top: 22px; }
.notice-box {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: #FBEBC9;
  color: #6B4A0E;
  border: 1px solid #EFCE86;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 22px;
  font-size: 0.98rem;
  line-height: 1.5;
}
.notice-box .notice-icon { flex-shrink: 0; font-size: 1.15rem; line-height: 1.4; }
.notice-box strong { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; color: #8A5A12; }
.state-msg { text-align: center; padding: 60px 24px; color: var(--charcoal-soft); font-size: 1.1rem; }

footer.site-footer { background: var(--charcoal); color: #DCD8CC; padding: 40px 96px; text-align: center; font-size: 0.9rem; }

@media (max-width: 900px) {
  .header-inner, .detail-wrap, footer.site-footer { padding-left: 24px; padding-right: 24px; }
  .detail-card { padding: 28px 26px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="programs.html" class="back-link">← Back to all programs</a>
  </div>
</header>

<div class="detail-wrap" id="detailWrap">
  <p class="state-msg">Loading program details…</p>
</div>

<footer class="site-footer">
  Activity Haven Recreation Centre — 180 Barnardo Ave, Peterborough, ON &nbsp;|&nbsp; 705-876-1670
</footer>

<script>
(function () {
  const SHEET_ID = '1tvGtCqroniAThEteWph0f4Bg1f_aiV0JqQU3M4ZTcOk';
  const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
  const detailWrap = document.getElementById('detailWrap');

  const params = new URLSearchParams(window.location.search);
  const wantDay = params.get('day') || '';
  const wantProgram = params.get('program') || '';

  function extractJson(text) {
    const start = text.indexOf('{');
    const end = text.lastIndexOf('}');
    return JSON.parse(text.substring(start, end + 1));
  }

  function cellText(row, i) {
    const c = row.c[i];
    return c && c.v != null ? String(c.v).trim() : '';
  }

  function resolveImageUrl(raw) {
    if (!raw) return '';
    // Auto-convert a Google Drive "share" link into a directly-embeddable one.
    const match = raw.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match) {
      return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
    }
    return raw;
  }

  function resolveVideoEmbedUrl(raw) {
    if (!raw) return '';
    // Auto-convert a Google Drive "share" link into an embeddable preview link.
    const match = raw.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match) {
      return `https://drive.google.com/file/d/${match[1]}/preview`;
    }
    return raw;
  }

  function isDirectVideoFile(raw) {
    return /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(raw);
  }

  function getYouTubeId(raw) {
    if (!raw) return '';
    const patterns = [
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?[^#]*\bv=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
    ];
    for (const p of patterns) {
      const m = raw.match(p);
      if (m) return m[1];
    }
    return '';
  }

  function resolveYouTubeEmbedUrl(raw) {
    const id = getYouTubeId(raw);
    if (!id) return '';
    // autoplay + mute (required together by every browser's autoplay policy),
    // loop (needs playlist=same id, a YouTube quirk for looping a single video),
    // controls=0 to hide the button bar, playsinline so mobile doesn't force fullscreen.
    return `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3`;
  }

  function extractCost(desc) {
    if (!desc) return '';
    const m = desc.match(/(session fee[^.]*\.)/i);
    return m ? m[1].trim() : '';
  }

  function statusBadgeInfo(status) {
    const key = (status || '').trim().toLowerCase();
    const known = { paused: 'Paused', rescheduled: 'Rescheduled', cancelled: 'Cancelled', ended: 'Ended' };
    return known[key] ? { key, label: known[key] } : null;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadProgram() {
    try {
      const res = await fetch(GVIZ_URL);
      if (!res.ok) throw new Error('Network response was not ok');
      const text = await res.text();
      const json = extractJson(text);
      const rows = json.table.rows;

      const match = rows
        .map(r => ({
          day: cellText(r, 0),
          program: cellText(r, 1),
          time: cellText(r, 2),
          room: cellText(r, 3),
          type: cellText(r, 4) || 'Drop-in',
          status: cellText(r, 5),
          image: cellText(r, 6),
          video: cellText(r, 7),
          leaders: cellText(r, 8),
          description: cellText(r, 9),
          notice: cellText(r, 10)
        }))
        .find(p => p.day === wantDay && p.program === wantProgram);

      if (!match) {
        detailWrap.innerHTML = '<p class="state-msg">We couldn\'t find that program — it may have been renamed or removed. <a href="programs.html" style="color:var(--coral); font-weight:700;">Browse all programs →</a></p>';
        return;
      }

      document.getElementById('pageTitle').textContent = match.program + ' | Activity Haven Recreation Centre';
      document.getElementById('pageDesc').setAttribute('content', match.description || match.program);

      // Prefer video over image; only show one.
      let mediaHtml = '';
      if (match.video && isDirectVideoFile(match.video)) {
        mediaHtml = `<div class="detail-video-wrap">
             <video class="detail-video-native" autoplay muted loop playsinline preload="auto">
               <source src="${escapeHtml(match.video)}" type="video/mp4">
             </video>
           </div>`;
      } else if (match.video && getYouTubeId(match.video)) {
        mediaHtml = `<div class="detail-video-wrap">
             <iframe class="detail-video" src="${escapeHtml(resolveYouTubeEmbedUrl(match.video))}"
                     allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                     allowfullscreen loading="lazy"></iframe>
           </div>`;
      } else if (match.video) {
        mediaHtml = `<div class="detail-video-wrap">
             <iframe class="detail-video" src="${escapeHtml(resolveVideoEmbedUrl(match.video))}" allow="autoplay" allowfullscreen loading="lazy"></iframe>
           </div>`;
      } else if (match.image) {
        mediaHtml = `<div class="detail-image-wrap">
             <div class="detail-image-skeleton"></div>
             <img class="detail-image" src="${escapeHtml(resolveImageUrl(match.image))}" alt="${escapeHtml(match.program)}"
                  onload="this.classList.add('is-loaded'); this.previousElementSibling.style.display='none';"
                  onerror="this.closest('.detail-image-wrap').style.display='none';">
           </div>`;
      }

      const leaderHtml = match.leaders
        ? `<div><span class="label">Led by</span>${escapeHtml(match.leaders)}</div>`
        : '';

      // For instructional classes, pull the cost out of the description so it
      // shows as its own field instead of being buried in the paragraph text.
      const isInstructional = (match.type || '').trim().toLowerCase() === 'instructional';
      const costText = isInstructional ? extractCost(match.description) : '';
      const cleanDescription = costText
        ? match.description.replace(costText, '').replace(/\s{2,}/g, ' ').trim()
        : match.description;
      const costHtml = costText
        ? `<div><span class="label">Cost</span>${escapeHtml(costText)}</div>`
        : '';

      const statusInfo = statusBadgeInfo(match.status);
      const statusBadgeHtml = statusInfo
        ? `<span class="status-badge" data-status="${statusInfo.key}">${escapeHtml(statusInfo.label)}</span>`
        : '';

      const noticeHtml = match.notice
        ? `<div class="notice-box"><span class="notice-icon">📌</span><div><strong>Notice</strong>${escapeHtml(match.notice)}</div></div>`
        : '';

      detailWrap.innerHTML = `
        <div class="detail-card" data-type="${escapeHtml(match.type)}">
          ${mediaHtml}
          <span class="type-badge">${escapeHtml(match.type)}</span>${statusBadgeHtml}
          <h1>${escapeHtml(match.program)}</h1>
          <div class="detail-meta">
            <div><span class="label">Day</span>${escapeHtml(match.day)}</div>
            <div><span class="label">Time</span>${escapeHtml(match.time)}</div>
            <div><span class="label">Room</span>${escapeHtml(match.room)}</div>
            ${leaderHtml}
            ${costHtml}
          </div>
          ${noticeHtml}
          <p class="detail-desc">${escapeHtml(cleanDescription)}</p>
        </div>`;

      const videoEl = detailWrap.querySelector('.detail-video-native');
      if (videoEl) {
        videoEl.muted = true;
        videoEl.play().catch(() => {});
      }
    } catch (err) {
      detailWrap.innerHTML = '<p class="state-msg">We couldn\'t load this program right now. Please try again shortly.</p>';
      console.error(err);
    }
  }

  loadProgram();
})();
</script>

</body>
</html>
