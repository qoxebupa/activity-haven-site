<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructional Poster (Live) | Activity Haven Recreation Centre</title>
<meta name="description" content="Auto-generated instructional classes poster, pulled live from the Program Hub spreadsheet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --teal-deep: #1E5F5B; --teal-mid: #2F8C82; --teal-pale: #E4EFEC;
  --cream: #FAF3E4; --paper: #FFFDF8; --coral: #D6604A; --coral-dark: #B84D39;
  --gold: #E3A23B; --charcoal: #2B2B26; --charcoal-soft: #55524A;
  --green-day: #8FCA9F; --green-alt: #C4E8CE;
  --font-display: "Fraunces", Georgia, serif; --font-body: "Public Sans", -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-body); color: var(--charcoal); background: var(--paper); font-size: 18px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; }
a { color: inherit; text-decoration: none; }

.site-header { background: var(--paper); }
.main-nav-row { position: sticky; top: 0; z-index: 50; background: var(--paper); border-bottom: 3px solid var(--teal-deep); }
.header-inner { max-width: 1200px; margin: 0 auto; padding: 10px 96px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; row-gap: 6px; }
.main-nav { display: flex; gap: 17px; flex-wrap: wrap; row-gap: 4px; justify-content: center; width: 100%; }
.main-nav a { font-weight: 600; font-size: 1.2rem; color: var(--charcoal); padding: 6px 2px; border-bottom: 2px solid transparent; }
.main-nav a:hover, .main-nav a.is-current { border-color: var(--coral); }

.print-bar { text-align: center; padding: 14px 24px; background: var(--cream); }
.btn-print {
  display: inline-flex; align-items: center; gap: 8px; padding: 12px 26px; border-radius: 999px;
  font-weight: 700; font-size: 0.95rem; border: none; cursor: pointer; font-family: var(--font-body);
  background: var(--coral); color: white;
}
.btn-print:hover { background: var(--coral-dark); }

.poster-wrap { max-width: 850px; margin: 20px auto; padding: 6px; }
.state-msg { text-align: center; color: var(--charcoal-soft); padding: 60px 20px; font-size: 1.1rem; }

.poster-block + .poster-block { margin-top: 46px; }
.poster-frame { border: 3px double var(--teal-deep); border-radius: 14px; padding: 20px 26px 26px; }

.poster-header { display: flex; align-items: center; gap: 16px; border-bottom: 3px solid var(--gold); padding-bottom: 14px; margin-bottom: 6px; }
.poster-header img { height: 54px; width: auto; }
.poster-header .org-name { font-size: 0.85rem; color: var(--charcoal-soft); font-weight: 600; }
.poster-header h1 { font-size: 1.7rem; color: var(--teal-deep); font-weight: 700; letter-spacing: 0.01em; }
.poster-note { font-size: 0.85rem; color: var(--coral-dark); font-weight: 700; margin: 8px 0 14px; text-align: center; }
.poster-subline { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; font-size: 0.85rem; color: var(--coral-dark); font-weight: 700; margin: 8px 0 14px; }
.poster-subline .updated { color: var(--charcoal-soft); font-weight: 600; white-space: nowrap; }

.day-heading {
  background: var(--green-day); color: var(--teal-deep); font-weight: 700; font-size: 1.05rem;
  padding: 5px 14px; border-radius: 6px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: 0.03em;
}
.day-heading:first-of-type { margin-top: 0; }

.prog-list { display: grid; }
.prog-row {
  display: grid; grid-template-columns: 145px 1fr auto auto; gap: 12px; align-items: baseline;
  padding: 4px 10px; break-inside: avoid;
}
.prog-row.alt { background: var(--green-alt); }
.prog-row .time { color: var(--charcoal-soft); font-size: 0.86rem; white-space: nowrap; }
.prog-row .desc { color: var(--charcoal); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog-row .room { color: var(--teal-deep); font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
.prog-row .fee { color: var(--coral-dark); font-weight: 700; font-size: 0.9rem; white-space: nowrap; text-align: right; }

footer.site-footer { background: var(--charcoal); color: #DCD8CC; padding: 40px 96px; text-align: center; font-size: 0.9rem; }
footer.site-footer a { color: var(--gold); }

@media print {
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: portrait; margin: 0.4in; }
  .site-header, .print-bar, footer.site-footer { display: none !important; }
  .poster-wrap { max-width: 100%; margin: 0; padding: 0; }
  .poster-frame { border-width: 2px; padding: 10px 14px 14px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .prog-row { padding: 2px 8px; font-size: 0.92rem; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .prog-row .desc { margin-left: 0.6in; }
  .day-heading { margin: 8px 0 3px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .day-group { break-inside: avoid; }
  .poster-block { break-after: page; }
  .poster-block:last-of-type { break-after: auto; }
  .poster-block + .poster-block { margin-top: 0; }
}
@media (max-width: 900px) {
  .header-inner, footer.site-footer { padding-left: 24px; padding-right: 24px; }
  .prog-row { grid-template-columns: 76px 1fr auto auto; font-size: 0.9rem; }
}
</style>
</head>
<body>

<header class="site-header">
  <nav class="main-nav-row">
    <div class="header-inner">
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="programs.html">Programs/Events</a>
        <a href="gallery.html" class="is-current">Gallery</a>
        <a href="newsletter.html">Newsletter</a>
        <a href="membership.html">Membership</a>
        <a href="index.html#volunteer">Volunteer</a>
        <a href="donate.html">Donate</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </nav>
</header>

<div class="print-bar">
  <button class="btn-print" onclick="window.print()">🖨 Print This Poster</button>
</div>

<div class="poster-wrap">
  <p class="state-msg" id="stateMsg">Loading the live schedule…</p>
  <div id="posterBody"></div>
</div>

<footer class="site-footer">
  Activity Haven Recreation Centre — 180 Barnardo Ave, Peterborough, ON &nbsp;|&nbsp; 705-876-1670
</footer>

<script>
(function () {
  const SHEET_ID = '1tvGtCqroniAThEteWph0f4Bg1f_aiV0JqQU3M4ZTcOk';
  const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
  const WEEKDAY_ORDER = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const TARGET_TYPE = 'Instructional';
  const LOGO_URL = 'https://i0.wp.com/activityhaven.org/wp-content/uploads/2025/11/ActivityHaven_50AnniLogo_IconFullColour.jpg?fit=993%2C1088&ssl=1';
  const ROWS_PER_PAGE = 20; // rough number of class rows that fits one printed portrait page, day headings included

  const stateMsg = document.getElementById('stateMsg');
  const posterBody = document.getElementById('posterBody');

  function extractJson(text) {
    const start = text.indexOf('{');
    const end = text.lastIndexOf('}');
    return JSON.parse(text.substring(start, end + 1));
  }
  function cellText(row, i) {
    const c = row.c[i];
    return c && c.v != null ? String(c.v).trim() : '';
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function extractFee(description) {
    const m = description.match(/\$([\d.]+)/);
    return m ? '$' + m[1] : '';
  }
  function orderedDays(programs) {
    const seen = [];
    WEEKDAY_ORDER.forEach(d => { if (programs.some(p => p.day === d) && !seen.includes(d)) seen.push(d); });
    programs.forEach(p => { if (!seen.includes(p.day)) seen.push(p.day); });
    return seen;
  }
  function weekRange() {
    // Next Monday (today, if today already is Monday) through that same week's Friday.
    const now = new Date();
    const daysUntilMonday = (1 - now.getDay() + 7) % 7;
    const monday = new Date(now);
    monday.setDate(now.getDate() + daysUntilMonday);
    const friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);
    const fmt = d => d.toLocaleDateString('en-CA', { month: 'long', day: 'numeric' });
    return `${fmt(monday)} to ${fmt(friday)}`;
  }

  const SAMPLE_PROGRAMS = [
    { day: 'Monday', program: 'Intermediate Line Dance with Kay (sample data)', time: '10:00-11:00am', room: 'RM 5', description: 'Session fee $16 + $3 user fee per class.' },
    { day: 'Tuesday', program: 'Cardio Drumming with Lisa (sample data)', time: '11:30am-12:30pm', room: 'RM 5', description: 'Session fee $45 + $3 user fee per class.' },
    { day: 'Wednesday', program: 'Chair Yoga with Mandy (sample data)', time: '2:30-3:30pm', room: 'RM 8', description: 'Session fee $45 + $3 user fee per class.' }
  ];

  function showPreviewBanner() {
    const b = document.createElement('div');
    b.style.cssText = 'background:var(--gold);color:var(--charcoal);text-align:center;padding:10px 20px;font-weight:700;font-size:0.9rem;';
    b.textContent = "Preview mode — showing sample rows because this file was opened locally. Real data loads automatically once this page is published online.";
    document.body.insertBefore(b, document.body.firstChild);
  }

  function posterHeaderHtml(pageIdx, pageCount) {
    const pageNote = pageCount > 1 ? ` — Page ${pageIdx + 1} of ${pageCount}` : '';
    return `
      <div class="poster-header">
        <img src="${LOGO_URL}" alt="Activity Haven logo">
        <div>
          <div class="org-name">Activity Haven Recreation Centre</div>
          <h1>Instructional Classes${pageNote}</h1>
        </div>
      </div>
      <div class="poster-subline">
        <span>$3 user fee applies to every class, in addition to the session fee shown below.</span>
        <span class="updated">Week of ${weekRange()}</span>
      </div>`;
  }

  // Groups days into pages so no page gets more rows than ROWS_PER_PAGE (a single very
  // long day may still exceed one page on its own — the browser will just flow it onward).
  function paginateDays(days, programsByDay) {
    const pages = [];
    let current = [];
    let currentRows = 0;
    days.forEach(day => {
      const rows = programsByDay[day].length;
      if (currentRows > 0 && currentRows + rows > ROWS_PER_PAGE) {
        pages.push(current);
        current = [];
        currentRows = 0;
      }
      current.push(day);
      currentRows += rows;
    });
    if (current.length) pages.push(current);
    return pages;
  }

  async function load() {
    let programs;
    try {
      const res = await fetch(GVIZ_URL);
      if (!res.ok) throw new Error('Network response was not ok');
      const text = await res.text();
      const json = extractJson(text);
      const rows = json.table.rows;

      programs = rows
        .map(r => ({
          day: cellText(r, 0), program: cellText(r, 1), time: cellText(r, 2),
          room: cellText(r, 3), type: cellText(r, 4) || 'Drop-in', status: cellText(r, 5),
          description: cellText(r, 9)
        }))
        .filter(p => p.day && p.program)
        .filter(p => !['cancelled', 'ended'].includes(p.status.trim().toLowerCase()))
        .filter(p => p.type === TARGET_TYPE);
    } catch (err) {
      programs = SAMPLE_PROGRAMS;
      showPreviewBanner();
    }

    try {
      if (programs.length === 0) {
        stateMsg.textContent = 'No instructional classes found in the Program Hub right now.';
        return;
      }

      stateMsg.style.display = 'none';
      const days = orderedDays(programs);
      const programsByDay = {};
      days.forEach(day => { programsByDay[day] = programs.filter(p => p.day === day); });
      const pages = paginateDays(days, programsByDay);

      let rowIndex = 0;
      let html = '';
      pages.forEach((pageDays, pageIdx) => {
        html += `<div class="poster-block"><div class="poster-frame">`;
        html += posterHeaderHtml(pageIdx, pages.length);
        pageDays.forEach(day => {
          const dayPrograms = programsByDay[day];
          if (dayPrograms.length === 0) return;
          html += `<div class="day-group"><div class="day-heading">${escapeHtml(day)}</div><div class="prog-list">`;
          dayPrograms.forEach(p => {
            const fee = extractFee(p.description);
            const altClass = (rowIndex % 2 === 1) ? ' alt' : '';
            rowIndex++;
            html += `<div class="prog-row${altClass}">
              <span class="time">${escapeHtml(p.time)}</span>
              <span class="desc">${escapeHtml(p.program)}</span>
              <span class="room">${p.room ? '📍 Room ' + escapeHtml(p.room) : ''}</span>
              <span class="fee">${escapeHtml(fee)}</span>
            </div>`;
          });
          html += `</div></div>`;
        });
        html += `</div></div>`;
      });

      posterBody.innerHTML = html;
    } catch (err) {
      stateMsg.textContent = "Couldn't load the live schedule right now. Please refresh, or check back shortly.";
      console.error(err);
    }
  }

  load();
})();
</script>

</body>
</html>
